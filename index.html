<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Zadania do zrobienia</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: { extend: { fontFamily: { sans: ['"Schibsted Grotesk"', 'system-ui', 'sans-serif'] } } }
    };
    // domyślnie jasny motyw; ciemny tylko jeśli został wybrany
    try { if (localStorage.getItem('todo-theme') === 'dark') document.documentElement.classList.add('dark'); } catch {}
  </script>
  <style>
    .task-done .t-title { text-decoration: line-through; opacity: .5; }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  </style>
</head>
<body class="min-h-screen bg-stone-100 text-slate-800 font-sans antialiased dark:bg-slate-950 dark:text-slate-200">
  <main class="mx-auto max-w-2xl px-4 py-10 sm:py-16">

    <header class="mb-8">
      <div class="flex items-start justify-between gap-4">
        <div>
          <p id="today" class="text-sm text-slate-500 dark:text-slate-400"></p>
          <h1 class="mt-1 text-3xl font-bold tracking-tight sm:text-4xl">Zadania</h1>
        </div>
        <button id="theme-toggle" type="button"
          class="rounded-lg border border-stone-300 bg-white px-3 py-2 text-sm font-medium text-slate-700 transition hover:bg-stone-50 focus:outline-none focus-visible:ring-2 focus-visible:ring-emerald-600 dark:border-slate-700 dark:bg-slate-900 dark:text-slate-200 dark:hover:bg-slate-800"></button>
      </div>
      <div class="mt-5">
        <div class="flex items-baseline justify-between text-sm">
          <span id="progress-label" class="font-medium"></span>
          <span id="progress-pct" class="text-slate-500 dark:text-slate-400"></span>
        </div>
        <div class="mt-2 h-2 overflow-hidden rounded-full bg-stone-200 dark:bg-slate-800">
          <div id="progress-bar" class="h-full rounded-full bg-emerald-600 transition-all duration-300" style="width:0%"></div>
        </div>
      </div>
    </header>

    <form id="add-form" class="rounded-2xl bg-white p-4 shadow-sm ring-1 ring-stone-200 dark:bg-slate-900 dark:ring-slate-800">
      <label for="new-title" class="sr-only">Nowe zadanie</label>
      <input id="new-title" type="text" required maxlength="200" autocomplete="off"
        placeholder="Co trzeba zrobić?"
        class="w-full rounded-lg border-0 bg-transparent px-1 py-2 text-lg placeholder:text-slate-400 focus:outline-none focus:ring-0">
      <div class="mt-3 flex flex-wrap items-center gap-2 border-t border-stone-100 pt-3 dark:border-slate-800">
        <label class="sr-only" for="new-prio">Priorytet</label>
        <select id="new-prio" class="rounded-lg border border-stone-200 bg-stone-50 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-600 dark:border-slate-700 dark:bg-slate-800">
          <option value="high">Pilne</option>
          <option value="normal" selected>Zwykłe</option>
          <option value="low">Kiedyś</option>
        </select>
        <label class="sr-only" for="new-due">Termin</label>
        <input id="new-due" type="date"
          class="rounded-lg border border-stone-200 bg-stone-50 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-600 dark:border-slate-700 dark:bg-slate-800 dark:[color-scheme:dark]">
        <button type="submit"
          class="ml-auto rounded-lg bg-emerald-700 px-4 py-2 text-sm font-semibold text-white transition hover:bg-emerald-800 focus:outline-none focus-visible:ring-2 focus-visible:ring-emerald-600 focus-visible:ring-offset-2 dark:focus-visible:ring-offset-slate-900">
          Dodaj zadanie
        </button>
      </div>
    </form>

    <div class="mt-8 flex flex-wrap items-center gap-3">
      <div id="filters" class="inline-flex rounded-lg bg-stone-200 p-1 text-sm dark:bg-slate-800" role="tablist">
        <button data-filter="all" class="rounded-md px-3 py-1.5 font-medium">Wszystkie</button>
        <button data-filter="active" class="rounded-md px-3 py-1.5 font-medium">Do zrobienia</button>
        <button data-filter="done" class="rounded-md px-3 py-1.5 font-medium">Zrobione</button>
      </div>
      <label class="sr-only" for="search">Szukaj</label>
      <input id="search" type="search" placeholder="Szukaj…"
        class="min-w-0 flex-1 rounded-lg border border-stone-200 bg-white px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-600 dark:border-slate-700 dark:bg-slate-900">
    </div>

    <ul id="list" class="mt-4 space-y-2"></ul>
    <p id="empty" class="hidden rounded-2xl border border-dashed border-stone-300 px-6 py-10 text-center text-slate-500 dark:border-slate-700 dark:text-slate-400"></p>

    <footer class="mt-8 flex flex-wrap items-center gap-x-5 gap-y-2 text-sm text-slate-500 dark:text-slate-400">
      <button id="clear-done" class="underline-offset-4 hover:text-slate-800 hover:underline dark:hover:text-slate-200">Usuń zrobione</button>
      <button id="export" class="underline-offset-4 hover:text-slate-800 hover:underline dark:hover:text-slate-200">Eksportuj do pliku</button>
      <button id="import" class="underline-offset-4 hover:text-slate-800 hover:underline dark:hover:text-slate-200">Importuj z pliku</button>
      <input id="import-file" type="file" accept="application/json" class="hidden">
      <span class="basis-full text-xs sm:basis-auto sm:ml-auto">Dane są zapisane tylko w tej przeglądarce.</span>
    </footer>
  </main>

  <script>
    const KEY = 'todo-praca-v1';
    const PRIO = {
      high:   { label: 'Pilne',  order: 0, bar: 'bg-rose-500',  chip: 'bg-rose-50 text-rose-700 dark:bg-rose-950 dark:text-rose-300' },
      normal: { label: 'Zwykłe', order: 1, bar: 'bg-sky-500',   chip: 'bg-sky-50 text-sky-700 dark:bg-sky-950 dark:text-sky-300' },
      low:    { label: 'Kiedyś', order: 2, bar: 'bg-stone-300 dark:bg-slate-600', chip: 'bg-stone-100 text-stone-600 dark:bg-slate-800 dark:text-slate-400' }
    };

    let tasks = load();
    let filter = 'all';
    let query = '';

    const $ = (s) => document.querySelector(s);
    const list = $('#list'), empty = $('#empty');

    function load() {
      try { const d = JSON.parse(localStorage.getItem(KEY)); return Array.isArray(d) ? d : []; }
      catch { return []; }
    }
    function save() {
      try { localStorage.setItem(KEY, JSON.stringify(tasks)); } catch { /* brak dostępu do storage */ }
    }
    const esc = (s) => s.replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const isoToday = () => { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); };

    function dueLabel(t) {
      if (!t.due) return null;
      const today = isoToday();
      const tomorrow = (() => { const d = new Date(today); d.setDate(d.getDate() + 1); return d.toISOString().slice(0, 10); })();
      const overdue = !t.done && t.due < today;
      let text;
      if (t.due === today) text = 'dziś';
      else if (t.due === tomorrow) text = 'jutro';
      else text = new Date(t.due).toLocaleDateString('pl-PL', { day: 'numeric', month: 'short' });
      return { text: overdue ? 'po terminie · ' + text : text, overdue };
    }

    function visibleTasks() {
      return tasks
        .filter(t => filter === 'all' || (filter === 'done' ? t.done : !t.done))
        .filter(t => t.title.toLowerCase().includes(query))
        .sort((a, b) =>
          (a.done - b.done) ||
          (PRIO[a.prio].order - PRIO[b.prio].order) ||
          ((a.due || '9999') > (b.due || '9999') ? 1 : (a.due || '9999') < (b.due || '9999') ? -1 : 0) ||
          (b.created - a.created));
    }

    function render() {
      // postęp
      const total = tasks.length, done = tasks.filter(t => t.done).length;
      $('#progress-label').textContent = total ? `${done} z ${total} zrobione` : 'Brak zadań';
      const pct = total ? Math.round(done / total * 100) : 0;
      $('#progress-pct').textContent = total ? pct + '%' : '';
      $('#progress-bar').style.width = pct + '%';

      // filtry
      document.querySelectorAll('#filters button').forEach(b => {
        const on = b.dataset.filter === filter;
        b.className = 'rounded-md px-3 py-1.5 font-medium transition ' + (on
          ? 'bg-white shadow-sm dark:bg-slate-700'
          : 'text-slate-600 hover:text-slate-900 dark:text-slate-400 dark:hover:text-slate-100');
        b.setAttribute('aria-selected', on);
      });

      // lista
      const items = visibleTasks();
      list.innerHTML = items.map(t => {
        const p = PRIO[t.prio], due = dueLabel(t);
        return `
        <li data-id="${t.id}" class="group relative flex items-start gap-3 overflow-hidden rounded-xl bg-white py-3 pl-5 pr-3 shadow-sm ring-1 ring-stone-200 dark:bg-slate-900 dark:ring-slate-800 ${t.done ? 'task-done' : ''}">
          <span class="absolute inset-y-0 left-0 w-1.5 ${p.bar}"></span>
          <button data-act="toggle" role="checkbox" aria-checked="${t.done}" aria-label="Oznacz jako zrobione"
            class="mt-0.5 grid h-5 w-5 shrink-0 place-items-center rounded-md border-2 transition focus:outline-none focus-visible:ring-2 focus-visible:ring-emerald-600 ${t.done ? 'border-emerald-600 bg-emerald-600 text-white' : 'border-stone-300 hover:border-emerald-600 dark:border-slate-600'}">
            ${t.done ? '<svg viewBox="0 0 20 20" class="h-3.5 w-3.5" fill="none" stroke="currentColor" stroke-width="3"><path d="M4 10l4 4 8-8"/></svg>' : ''}
          </button>
          <div class="min-w-0 flex-1">
            <p class="t-title cursor-text break-words leading-snug" data-act="edit" title="Kliknij dwukrotnie, aby edytować">${esc(t.title)}</p>
            <div class="mt-1.5 flex flex-wrap items-center gap-2 text-xs">
              <span class="rounded-full px-2 py-0.5 font-medium ${p.chip}">${p.label}</span>
              ${due ? `<span class="${due.overdue ? 'font-semibold text-rose-600 dark:text-rose-400' : 'text-slate-500 dark:text-slate-400'}">${due.text}</span>` : ''}
            </div>
          </div>
          <button data-act="delete" aria-label="Usuń zadanie"
            class="rounded-md p-1 text-slate-400 opacity-0 transition hover:bg-rose-50 hover:text-rose-600 focus:opacity-100 group-hover:opacity-100 dark:hover:bg-rose-950 max-sm:opacity-100">
            <svg viewBox="0 0 20 20" class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 5l10 10M15 5L5 15"/></svg>
          </button>
        </li>`;
      }).join('');

      const msg = !tasks.length ? 'Lista jest pusta. Dodaj pierwsze zadanie powyżej.'
        : !items.length ? (query ? 'Nic nie pasuje do wyszukiwania.' : filter === 'done' ? 'Nic jeszcze nie zrobiono.' : 'Wszystko zrobione.')
        : '';
      empty.textContent = msg;
      empty.classList.toggle('hidden', !msg);
    }

    // dodawanie
    $('#add-form').addEventListener('submit', e => {
      e.preventDefault();
      const title = $('#new-title').value.trim();
      if (!title) return;
      tasks.push({
        id: crypto.randomUUID ? crypto.randomUUID() : String(Date.now() + Math.random()),
        title, prio: $('#new-prio').value, due: $('#new-due').value || '', done: false, created: Date.now()
      });
      save();
      $('#new-title').value = ''; $('#new-due').value = ''; $('#new-prio').value = 'normal';
      $('#new-title').focus();
      render();
    });

    // akcje na liście
    list.addEventListener('click', e => {
      const btn = e.target.closest('[data-act]');
      if (!btn) return;
      const id = btn.closest('li').dataset.id;
      const t = tasks.find(x => x.id === id);
      if (btn.dataset.act === 'toggle') { t.done = !t.done; save(); render(); }
      if (btn.dataset.act === 'delete') { tasks = tasks.filter(x => x.id !== id); save(); render(); }
    });

    // edycja tytułu (dwuklik)
    list.addEventListener('dblclick', e => {
      const p = e.target.closest('[data-act="edit"]');
      if (!p) return;
      const id = p.closest('li').dataset.id;
      const t = tasks.find(x => x.id === id);
      const input = document.createElement('input');
      input.value = t.title; input.maxLength = 200;
      input.className = 'w-full rounded-md border border-emerald-600 bg-transparent px-2 py-1 focus:outline-none';
      p.replaceWith(input); input.focus(); input.select();
      let finished = false;
      const finish = (ok) => {
        if (finished) return; finished = true;
        const v = input.value.trim();
        if (ok && v) { t.title = v; save(); }
        render();
      };
      input.addEventListener('keydown', ev => { if (ev.key === 'Enter') finish(true); if (ev.key === 'Escape') finish(false); });
      input.addEventListener('blur', () => finish(true));
    });

    // filtry i szukanie
    $('#filters').addEventListener('click', e => {
      const b = e.target.closest('[data-filter]'); if (!b) return;
      filter = b.dataset.filter; render();
    });
    $('#search').addEventListener('input', e => { query = e.target.value.trim().toLowerCase(); render(); });

    // stopka
    $('#clear-done').addEventListener('click', () => {
      const n = tasks.filter(t => t.done).length;
      if (n && confirm(`Usunąć zrobione zadania (${n})?`)) { tasks = tasks.filter(t => !t.done); save(); render(); }
    });
    $('#export').addEventListener('click', () => {
      const blob = new Blob([JSON.stringify(tasks, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `zadania-${isoToday()}.json`;
      a.click(); URL.revokeObjectURL(a.href);
    });
    $('#import').addEventListener('click', () => $('#import-file').click());
    $('#import-file').addEventListener('change', async e => {
      const file = e.target.files[0]; if (!file) return;
      try {
        const data = JSON.parse(await file.text());
        if (!Array.isArray(data)) throw new Error();
        const clean = data.filter(t => t && typeof t.title === 'string').map(t => ({
          id: String(t.id || Date.now() + Math.random()), title: t.title.slice(0, 200),
          prio: PRIO[t.prio] ? t.prio : 'normal', due: t.due || '', done: !!t.done, created: t.created || Date.now()
        }));
        if (confirm(`Zastąpić obecną listę ${clean.length} zadaniami z pliku?`)) { tasks = clean; save(); render(); }
      } catch { alert('Nie udało się wczytać pliku. Wybierz plik JSON wyeksportowany z tej strony.'); }
      e.target.value = '';
    });

    // przełącznik motywu
    const themeBtn = $('#theme-toggle');
    function syncThemeBtn() {
      themeBtn.textContent = document.documentElement.classList.contains('dark') ? 'Motyw jasny' : 'Motyw ciemny';
    }
    themeBtn.addEventListener('click', () => {
      const dark = document.documentElement.classList.toggle('dark');
      try { localStorage.setItem('todo-theme', dark ? 'dark' : 'light'); } catch {}
      syncThemeBtn();
    });
    syncThemeBtn();

    $('#today').textContent = new Date().toLocaleDateString('pl-PL', { weekday: 'long', day: 'numeric', month: 'long' });
    render();
  </script>
</body>
</html>
