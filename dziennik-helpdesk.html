<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dziennik helpdesk</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = { theme: { extend: { colors: { page: '#f4f7f9' } } } }
</script>
<style>
  body { font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif; }
</style>
</head>
<body class="bg-page text-slate-800 min-h-screen">
<div class="max-w-6xl mx-auto px-4 py-8 space-y-6">

  <!-- Nagłówek -->
  <header class="flex flex-wrap items-start justify-between gap-3">
    <div>
      <h1 class="text-2xl font-semibold text-slate-800">Dziennik helpdesk</h1>
      <p class="text-sm text-slate-500">Co zrobiłem w pracy i jak rozwiązałem problemy.</p>
    </div>
    <div class="flex gap-2">
      <button onclick="exportData()" class="btn-sec">
        <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.75"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v12m0 0l-4-4m4 4l4-4M4 20h16"/></svg>Eksport
      </button>
      <label class="btn-sec cursor-pointer">
        <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.75"><path stroke-linecap="round" stroke-linejoin="round" d="M12 16V4m0 0L8 8m4-4l4 4M4 20h16"/></svg>Import
        <input type="file" accept=".json" class="hidden" onchange="importData(event)">
      </label>
    </div>
  </header>

  <!-- Zakładki i wyszukiwarka -->
  <div class="flex flex-wrap items-center gap-3">
    <div class="flex gap-2">
      <button id="tab-log" onclick="showTab('log')"></button>
      <button id="tab-sol" onclick="showTab('sol')"></button>
    </div>
    <input id="search" oninput="render()" placeholder="Szukaj (tekst, ticket, maszyna, tag)..." class="inp sm:max-w-sm sm:ml-auto">
  </div>

  <!-- DZIENNIK -->
  <section id="sec-log" class="space-y-6">
    <div class="card p-5 grid gap-4 sm:grid-cols-3">
      <div><label class="lbl" for="l-date">Data</label><input id="l-date" type="date" class="inp"></div>
      <div><label class="lbl" for="l-ticket">Nr ticketu</label><input id="l-ticket" class="inp"></div>
      <div><label class="lbl" for="l-machine">Maszyna / system</label><input id="l-machine" class="inp"></div>
      <div class="sm:col-span-3"><label class="lbl" for="l-text">Co zrobiłem</label><textarea id="l-text" rows="3" class="inp"></textarea></div>
      <div class="sm:col-span-3"><button onclick="addLog()" class="btn-pri">Dodaj wpis</button></div>
    </div>
    <div id="log-list" class="space-y-4"></div>
  </section>

  <!-- ROZWIĄZANIA -->
  <section id="sec-sol" class="hidden space-y-6">
    <div class="card p-5 grid gap-4 sm:grid-cols-3">
      <div class="sm:col-span-3"><label class="lbl" for="s-title">Problem</label><input id="s-title" class="inp"></div>
      <div><label class="lbl" for="s-ticket">Nr ticketu</label><input id="s-ticket" class="inp"></div>
      <div><label class="lbl" for="s-machine">Maszyna / system</label><input id="s-machine" class="inp"></div>
      <div><label class="lbl" for="s-tags">Tagi (po przecinku)</label><input id="s-tags" class="inp"></div>
      <div class="sm:col-span-3"><label class="lbl" for="s-text">Rozwiązanie / kroki</label><textarea id="s-text" rows="5" class="inp font-mono"></textarea></div>
      <div class="sm:col-span-3"><button onclick="addSol()" class="btn-pri">Zapisz rozwiązanie</button></div>
    </div>
    <div id="sol-list" class="space-y-4"></div>
  </section>
</div>

<!-- Modal potwierdzenia usunięcia -->
<div id="modal" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-slate-900/40 p-4" onclick="if(event.target===this)closeModal()">
  <div class="w-full max-w-sm rounded-xl bg-white p-6 shadow-xl">
    <h2 class="text-lg font-semibold text-slate-800">Usunąć wpis?</h2>
    <p class="mt-1 text-sm text-slate-500">Tej operacji nie można cofnąć.</p>
    <div class="mt-5 flex justify-end gap-2">
      <button onclick="closeModal()" class="btn-sec">Anuluj</button>
      <button onclick="confirmDel()" class="btn-danger">Usuń</button>
    </div>
  </div>
</div>

<script>
// Stałe
const KEY = 'dziennik-helpdesk-v1';
const BTN = 'inline-flex items-center gap-2 rounded-lg px-4 py-2 text-sm font-medium shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 transition ';
const CLS = {
  pri: BTN + 'bg-blue-600 text-white hover:bg-blue-700',
  sec: BTN + 'bg-white text-slate-700 border border-slate-300 hover:bg-slate-50',
  danger: BTN + 'bg-red-600 text-white hover:bg-red-700',
  card: 'rounded-xl border border-slate-200 bg-white shadow-sm',
  inp: 'w-full rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20 outline-none',
  lbl: 'block text-sm font-medium text-slate-700 mb-1'
};
const BADGE = 'inline-flex items-center rounded-full px-2.5 py-0.5 text-xs font-medium ';
const TRASH = '<svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.75"><path stroke-linecap="round" stroke-linejoin="round" d="M4 7h16M10 11v6m4-6v6M6 7l1 12h10l1-12M9 7V4h6v3"/></svg>';

let db = { logs: [], sols: [] };
let tab = 'log';
let pending = null;

try { const s = localStorage.getItem(KEY); if (s) db = JSON.parse(s); } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(db)); } catch (e) { alert('Nie można zapisać danych.'); } };
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today = () => new Date().toISOString().slice(0, 10);

// Nadanie stałych klas elementom statycznym
document.querySelectorAll('.btn-pri').forEach(e => e.className = CLS.pri);
document.querySelectorAll('.btn-sec').forEach(e => e.className = CLS.sec);
document.querySelectorAll('.btn-danger').forEach(e => e.className = CLS.danger);
document.querySelectorAll('.card').forEach(e => e.className += ' ' + CLS.card);
document.querySelectorAll('.inp').forEach(e => e.className = CLS.inp + ' ' + e.className.replace('inp', '').trim());
document.querySelectorAll('.lbl').forEach(e => e.className = CLS.lbl);
$('l-date').value = today();

function showTab(t) {
  tab = t;
  $('sec-log').classList.toggle('hidden', t !== 'log');
  $('sec-sol').classList.toggle('hidden', t !== 'sol');
  render();
}

function addLog() {
  const text = $('l-text').value.trim();
  if (!text) return;
  db.logs.push({ id: Date.now(), date: $('l-date').value || today(), machine: $('l-machine').value.trim(), ticket: $('l-ticket').value.trim(), text });
  $('l-text').value = ''; $('l-machine').value = ''; $('l-ticket').value = '';
  save(); render();
}

function addSol() {
  const title = $('s-title').value.trim(), text = $('s-text').value.trim();
  if (!title || !text) return;
  db.sols.push({ id: Date.now(), date: today(), title, text,
    machine: $('s-machine').value.trim(), ticket: $('s-ticket').value.trim(),
    tags: $('s-tags').value.split(',').map(t => t.trim()).filter(Boolean) });
  ['s-title','s-text','s-machine','s-tags','s-ticket'].forEach(i => $(i).value = '');
  save(); render();
}

// Modal usuwania
function askDel(type, id) { pending = { type, id }; $('modal').classList.remove('hidden'); }
function closeModal() { pending = null; $('modal').classList.add('hidden'); }
function confirmDel() { if (pending) { db[pending.type] = db[pending.type].filter(x => x.id !== pending.id); save(); } closeModal(); render(); }
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

function copySol(id) { const s = db.sols.find(x => x.id === id); navigator.clipboard.writeText(s.title + '\n\n' + s.text); }

const empty = msg => `<div class="rounded-xl border border-slate-200 bg-slate-50 p-6 text-center text-sm text-slate-500">${msg}</div>`;
const delBtn = (type, id) => `<button onclick="askDel('${type}',${id})" class="text-slate-400 hover:text-red-600" aria-label="Usuń">${TRASH}</button>`;

function render() {
  const q = $('search').value.toLowerCase();
  const match = o => JSON.stringify(o).toLowerCase().includes(q);
  $('tab-log').className = tab === 'log' ? CLS.pri : CLS.sec; $('tab-log').textContent = `Dziennik (${db.logs.length})`;
  $('tab-sol').className = tab === 'sol' ? CLS.pri : CLS.sec; $('tab-sol').textContent = `Rozwiązania (${db.sols.length})`;

  // Dziennik pogrupowany po dniach
  const logs = db.logs.filter(match).sort((a, b) => b.date.localeCompare(a.date) || b.id - a.id);
  const groups = {};
  logs.forEach(l => (groups[l.date] = groups[l.date] || []).push(l));
  $('log-list').innerHTML = Object.keys(groups).map(d => `
    <div class="${CLS.card} p-5">
      <h3 class="text-sm font-semibold text-slate-500 mb-3">${esc(new Date(d + 'T00:00').toLocaleDateString('pl-PL', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }))}</h3>
      <ul class="divide-y divide-slate-100">${groups[d].map(l => `
        <li class="flex justify-between gap-3 py-2.5 first:pt-0 last:pb-0">
          <div class="space-y-1">
            <div class="flex flex-wrap gap-1.5">
              ${l.ticket ? `<span class="${BADGE}bg-sky-50 text-sky-700 font-mono">${esc(l.ticket)}</span>` : ''}
              ${l.machine ? `<span class="${BADGE}bg-slate-100 text-slate-700">${esc(l.machine)}</span>` : ''}
            </div>
            <p class="text-sm whitespace-pre-wrap">${esc(l.text)}</p>
          </div>
          ${delBtn('logs', l.id)}
        </li>`).join('')}</ul>
    </div>`).join('') || empty('Brak wpisów.');

  // Rozwiązania
  const sols = db.sols.filter(match).sort((a, b) => b.id - a.id);
  $('sol-list').innerHTML = sols.map(s => `
    <details class="${CLS.card} p-5">
      <summary class="cursor-pointer flex flex-wrap items-center gap-1.5">
        <span class="font-semibold text-slate-800 mr-1">${esc(s.title)}</span>
        ${s.ticket ? `<span class="${BADGE}bg-sky-50 text-sky-700 font-mono">${esc(s.ticket)}</span>` : ''}
        ${s.machine ? `<span class="${BADGE}bg-slate-100 text-slate-700">${esc(s.machine)}</span>` : ''}
        ${s.tags.map(t => `<span class="${BADGE}bg-emerald-50 text-emerald-700">#${esc(t)}</span>`).join('')}
      </summary>
      <pre class="mt-4 whitespace-pre-wrap rounded-lg bg-slate-50 border border-slate-200 p-3 font-mono text-sm text-slate-800">${esc(s.text)}</pre>
      <div class="mt-3 flex items-center justify-between text-sm text-slate-500">
        <span>${esc(s.date)}</span>
        <span class="flex items-center gap-3"><button onclick="copySol(${s.id})" class="hover:text-blue-600">Kopiuj</button>${delBtn('sols', s.id)}</span>
      </div>
    </details>`).join('') || empty('Brak rozwiązań.');
}

function exportData() {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(db, null, 2)], { type: 'application/json' }));
  a.download = 'dziennik-helpdesk-' + today() + '.json'; a.click();
}
function importData(e) {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try { const d = JSON.parse(r.result); if (!Array.isArray(d.logs) || !Array.isArray(d.sols)) throw 0; db = d; save(); render(); }
    catch (x) { alert('Nieprawidłowy plik.'); }
  };
  r.readAsText(f);
}
render();
</script>
</body>
</html>
